[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "refmod-builder"
version = "0.1.1"
description = "A native desktop reference package builder for MiniMax H3"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<6.9", "httpx>=0.28,<1", "Pillow>=11,<12"]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "numpy>=2,<3", "safetensors>=0.5,<1"]
macos-build = ["pyinstaller>=6.12,<7", "imageio-ffmpeg==0.6.0"]
[project.scripts]
refmod-builder = "refmod_builder.ui:main"
[tool.hatch.build.targets.wheel]
packages = ["refmod_builder"]
[tool.pytest.ini_options]
testpaths = ["tests"]
